services:
  db:
    image: postgres:16-alpine
    container_name: jhipster_db
    restart: always
    environment:
      POSTGRES_DB: generador
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminn
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d generador"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama_init_llama3
    depends_on:
      - ollama
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      echo 'Esperando que el servicio Ollama esté listo...';
      until ollama list > /dev/null 2>&1; do
        sleep 2;
      done;
      echo 'Descargando modelo llama3 en Ollama...';
      ollama pull llama3;
      echo '¡Modelo llama3 descargado y listo para usar!';
      "

  web-app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: jhipster_webapp
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=adminn
      - DB_NAME=generador
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - generated_data:/app/web-app/generated
      - uploads_data:/app/web-app/uploads

volumes:
  postgres_data:
  ollama_data:
  generated_data:
  uploads_data:
